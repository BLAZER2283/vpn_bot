services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vpn} -d ${POSTGRES_DB:-vpn}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    ports:
      - '8080:8080'           # subscription-endpoint (http://IP:8080/s/<token>)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Когда купишь домен: раскомментируй, пропиши SUB_DOMAIN и A-запись
  # на этот сервер. Caddy сам выпустит и продлит Let's Encrypt сертификат,
  # а порт 8080 у бота можно будет убрать из публичного доступа.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   env_file: .env
  #   depends_on:
  #     bot:
  #       condition: service_started
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   restart: unless-stopped

volumes:
  postgres_data:
